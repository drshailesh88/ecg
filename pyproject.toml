[project]
name = "ecg-guru"
version = "0.1.0"
description = "AI-powered ECG analysis and teaching platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dr. Shailesh", email = "drshailesh88@gmail.com" }
]
keywords = ["ecg", "cardiology", "ai", "medical", "electrophysiology"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    # API Server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    # Core
    "ollama>=0.1.0",
    "chromadb>=0.4.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    # Image processing
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    # Advanced RAG
    "sentence-transformers>=2.2.0",  # PubMedBERT embeddings & cross-encoder
    "rank-bm25>=0.2.2",  # BM25 sparse retrieval
    # PDF processing
    "pymupdf>=1.23.0",  # PyMuPDF for PDF parsing
    "beautifulsoup4>=4.12.0",  # HTML parsing for LITFL scraper
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
]
# Flet UI (optional - for desktop/mobile native app)
ui = [
    "flet>=0.21.0",
]

[project.scripts]
ecg-guru-server = "src.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_guru"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
